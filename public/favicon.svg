<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ruby favicon">
  <defs>
    <linearGradient id="rubyGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity=".9"/>
    </linearGradient>
    <clipPath id="gemClip">
      <!-- Ruby silhouette: flat top, beveled shoulders, wide body, pointed base -->
      <path d="M14 12 L50 12 L56 22 L60 30 L32 56 L4 30 L8 22 Z"/>
    </clipPath>
  </defs>

  <!-- Base shape -->
  <path fill="url(#rubyGrad)" d="M14 12 L50 12 L56 22 L60 30 L32 56 L4 30 L8 22 Z"/>

  <!-- Facets similar to provided reference -->
  <!-- Top row -->
  <polygon points="14,12 28,12 22,22 8,22" fill="#f87171" opacity="0.75"/>
  <polygon points="28,12 36,12 32,22 22,22" fill="#ef4444" opacity="0.8"/>
  <polygon points="36,12 50,12 56,22 42,22" fill="#f87171" opacity="0.75"/>
  <!-- Shoulder quads -->
  <polygon points="8,22 22,22 16,30 4,30" fill="#ef4444" opacity="0.7"/>
  <polygon points="42,22 56,22 60,30 48,30" fill="#ef4444" opacity="0.7"/>
  <!-- Central dark body (two triangles) -->
  <polygon points="32,22 48,30 32,56" fill="#b91c1c" opacity="0.95"/>
  <polygon points="32,22 32,56 16,30" fill="#dc2626" opacity="0.9"/>
  <!-- Lower outer facets -->
  <polygon points="4,30 16,30 32,56" fill="#ef4444" opacity="0.55"/>
  <polygon points="60,30 48,30 32,56" fill="#ef4444" opacity="0.55"/>

  <!-- Outline -->
  <path d="M14 12 L50 12 L56 22 L60 30 L32 56 L4 30 L8 22 Z" fill="none" stroke="#2b1f1f" stroke-width="2" stroke-linejoin="round"/>

  <!-- Shimmer animation -->
  <g clip-path="url(#gemClip)" opacity="0.75">
    <rect id="shine" x="-24" y="0" width="16" height="64" fill="white" fill-opacity="0.18" transform="rotate(25 0 0)">
      <animate attributeName="x" from="-24" to="80" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <style>
    @media (prefers-reduced-motion: reduce) { #shine { display: none; } }
  </style>
</svg>
