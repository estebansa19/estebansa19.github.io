name: CI

# The deploy workflow only runs on pushes to main, so without this a pull
# request would merge with nothing verified. Same checks, no deployment.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The build prints /cv to a PDF with headless Chromium (integrations/cv-pdf.mjs).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
