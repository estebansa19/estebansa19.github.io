version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # One PR for every minor and patch bump; majors still arrive one per PR.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check only supports TypeScript 5 and 6.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
